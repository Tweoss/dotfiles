[[language]]
name = "numbat"
scope = "source.numbat"
file-types = ["numbat"]
comment-token = "#"
grammar = "numbat"

[[grammar]]
name = "numbat"
source = { git = "https://github.com/irevoire/tree-sitter-numbat", rev = "b4dd180397cad0638abbf18b54e354ea43276f46" }

[[language]]
name = "asm"
scope = "source.asm"
file-types = ["S", "s"]
roots = []
comment-token = "//"

[[grammar]]
name = "asm"
source = { git = "https://github.com/rush-rs/tree-sitter-asm", rev = "36dc26acc7818920de2e103e20a9f42358caf926" }
