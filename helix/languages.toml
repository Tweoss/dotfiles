[[language]]
name = "rust"
language-servers = [ "ra-multiplex" ]

[language-server.ra-multiplex]
command = "ra-multiplex"

[language-server.ra-multiplex.config.check]
command = "clippy"
[language-server.ra-multiplex.config.cargo]
targetDir = true

[[language]]
name = "typescript"
indent = { tab-width = 4, unit = "    " }

[language-server.tinymist]
command = "tinymist"
# command = "typst-lsp"
config = { formatterMode = "typstyle", formatterPrintWidth = 80, exportPdf = "never" }

# [language-server.typst.config]
# exportPdf = "never"

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[[language]]
name = "typst"
scope = "source.typst"
injection-regex = "^typ(st)?$"
file-types = ["typ"]
comment-token = "//"
roots = []
language-servers = ["harper-ls", "tinymist"]
indent = { tab-width = 2, unit = "  " }
# formatter = { command = "typstfmt", args = ["--output", "-"] }
auto-format = true

[language.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'
'$' = '$'



[[language]]
name = "lilypond"
scope = "source.ly"
comment-token = "%"
roots = []
file-types = ["ly"]
grammar = "lilypond-g"

[language-server.typescript]
command = "typescript-language-server"

[[language]]
name = "typescript"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true

[[grammar]]
name = "lilypond-g"
source = { git = "https://github.com/nwhetsell/tree-sitter-lilypond", rev = "016d651d3983d090a7f7ef4753c87b5ed498ad0f" }

